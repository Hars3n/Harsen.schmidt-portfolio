<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - HARSEN Schmidt</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #FF0033;
            --bg-dark: #1a1a1a;
        }

        body {
            font-family: 'Source Code Pro', monospace;
            background: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            z-index: 1000;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        header a:hover {
            color: var(--primary-red);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .portfolio-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .portfolio-header h1 {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 80px;
            font-weight: 400;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }

        .portfolio-header p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
        }

        .projects-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .project-btn {
            position: relative;
            aspect-ratio: 1;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .project-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-red);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
        }

        .project-btn:hover::before {
            transform: scaleY(1);
        }

        .project-btn:hover {
            border-color: var(--primary-red);
            transform: translateY(-5px);
        }

        .project-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }

        .project-number {
            font-size: 14px;
            color: var(--primary-red);
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .project-btn:hover .project-number {
            color: #fff;
        }

        .project-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: -0.5px;
            line-height: 1.3;
            transition: color 0.3s ease;
        }

        .project-btn:hover .project-title {
            color: #fff;
        }

        .project-arrow {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 24px;
            opacity: 0;
            transform: translate(-10px, 10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-btn:hover .project-arrow {
            opacity: 1;
            transform: translate(0, 0);
        }

        footer {
            padding: 40px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(10px);
        }

        footer p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        footer p span:last-child {
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        footer p span:last-child:hover {
            color: var(--primary-red);
        }

        footer p span:last-child::after {
            content: '🔍';
            position: absolute;
            right: -25px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        footer p span:last-child:hover::after {
            opacity: 1;
        }

        /* ========== EASTER EGGS STYLES ========== */
        
        /* Easter Egg 1: Inversion des couleurs */
        .inverted {
            filter: invert(1) hue-rotate(180deg);
            transition: filter 0.5s ease;
        }

        /* Easter Egg 2: Mode Windows 98 */
        body.win98-mode {
            font-family: 'Courier New', monospace !important;
            background: #008080 !important;
            transition: all 0.5s ease;
        }

        body.win98-mode * {
            font-family: 'Courier New', monospace !important;
        }

        body.win98-mode .project-btn,
        body.win98-mode header,
        body.win98-mode footer {
            border: 3px outset #c0c0c0 !important;
            background: #c0c0c0 !important;
            color: #000 !important;
            box-shadow: 2px 2px 0 #000 !important;
        }

        body.win98-mode .project-title,
        body.win98-mode .project-number,
        body.win98-mode header a,
        body.win98-mode footer p {
            color: #000 !important;
        }

        /* Easter Egg 4: Mode Kawaii Orlane */
        body.kawaii-mode {
            background: linear-gradient(135deg, #FFB6C1 0%, #FFC0CB 25%, #FFE4E1 50%, #FFF0F5 75%, #FFB6C1 100%) !important;
            background-size: 400% 400% !important;
            animation: kawaii-gradient 15s ease infinite !important;
        }

        @keyframes kawaii-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body.kawaii-mode * {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive !important;
        }

        body.kawaii-mode .project-btn,
        body.kawaii-mode header,
        body.kawaii-mode footer {
            background: rgba(255, 255, 255, 0.9) !important;
            border: 3px solid #FFB6C1 !important;
            color: #FF69B4 !important;
            box-shadow: 
                0 0 20px rgba(255, 182, 193, 0.6),
                inset 0 0 30px rgba(255, 192, 203, 0.3) !important;
            border-radius: 20px !important;
        }

        body.kawaii-mode .project-title,
        body.kawaii-mode header a,
        body.kawaii-mode footer p {
            color: #FF69B4 !important;
            text-shadow: 2px 2px 0 #FFC0CB !important;
        }

        body.kawaii-mode .project-number {
            color: #FF1493 !important;
        }

        body.kawaii-mode .portfolio-header h1::after {
            background: linear-gradient(to right, #FF69B4, #FFB6C1) !important;
        }

        /* Petits noeuds kawaii flottants */
        body.kawaii-mode::before,
        body.kawaii-mode::after {
            content: '🎀';
            position: fixed;
            font-size: 40px;
            animation: float-bow 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 9999;
        }

        body.kawaii-mode::before {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        body.kawaii-mode::after {
            top: 20%;
            right: 10%;
            animation-delay: 2s;
        }

        @keyframes float-bow {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        /* Textes coréens */
        body.kawaii-mode .portfolio-header h1::before {
            content: '포트폴리오 ';
            color: #FFB6C1;
            font-size: 0.5em;
            display: block;
            margin-bottom: 10px;
        }

        body.kawaii-mode .portfolio-header p::after {
            content: ' ♡ 귀여워 ♡';
            color: #FF69B4;
        }

        /* Coeurs flottants */
        .kawaii-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9997;
            display: none;
        }

        body.kawaii-mode .kawaii-hearts {
            display: block;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: float-up 6s ease-in infinite;
            opacity: 0;
        }

        @keyframes float-up {
            0% {
                opacity: 0;
                transform: translateY(0) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) rotate(360deg);
            }
        }

        /* Animation tremblement de terre */
        .secret-search {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            padding: 20px;
            background: rgba(26, 26, 26, 0.98);
            border: 2px solid var(--primary-red);
            border-radius: 10px;
            z-index: 10000;
            transition: bottom 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: blur(10px);
            box-shadow: 0 -10px 40px rgba(255, 0, 51, 0.4);
        }

        .secret-search.active {
            bottom: 120px;
        }

        .secret-search input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 16px;
            font-family: 'Source Code Pro', monospace;
            outline: none;
            transition: all 0.3s ease;
        }

        .secret-search input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary-red);
        }

        .secret-search input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        @keyframes earthquake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-10px, 5px) rotate(-1deg); }
            20% { transform: translate(10px, -5px) rotate(1deg); }
            30% { transform: translate(-8px, 8px) rotate(-1deg); }
            40% { transform: translate(8px, -8px) rotate(1deg); }
            50% { transform: translate(-10px, 5px) rotate(-0.5deg); }
            60% { transform: translate(10px, -5px) rotate(0.5deg); }
            70% { transform: translate(-5px, 5px) rotate(-0.5deg); }
            80% { transform: translate(5px, -5px) rotate(0.5deg); }
            90% { transform: translate(-3px, 3px) rotate(-0.25deg); }
        }

        body.earthquake {
            animation: earthquake 1s ease-in-out;
        }

        @media (max-width: 1024px) {
            .container {
                padding: 80px 30px;
            }

            .portfolio-header h1 {
                font-size: 60px;
            }

            .projects-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 80px 20px;
            }

            .portfolio-header h1 {
                font-size: 40px;
            }

            .portfolio-header p {
                font-size: 14px;
            }

            .projects-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .project-title {
                font-size: 20px;
            }

            header {
                padding: 15px 20px;
                gap: 20px;
            }

            header a {
                font-size: 12px;
            }

            .secret-search {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html">ACCUEIL</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="contact.html">CONTACT</a>
    </header>

    <div class="container">
        <div class="portfolio-header">
            <h1>PORTFOLIO</h1>
            <p>Découvrez mes créations graphiques</p>
        </div>

        <div class="projects-container">
            <a href="identite.html" class="project-btn">
                <div class="project-content">
                    <div class="project-number">01</div>
                    <h2 class="project-title">Identité<br>visuelle</h2>
                </div>
                <span class="project-arrow">→</span>
            </a>

            <a href="affiche-edition.html" class="project-btn">
                <div class="project-content">
                    <div class="project-number">02</div>
                    <h2 class="project-title">Affiche &<br>Édition</h2>
                </div>
                <span class="project-arrow">→</span>
            </a>

            <a href="experimentation.html" class="project-btn">
                <div class="project-content">
                    <div class="project-number">03</div>
                    <h2 class="project-title">Expéri-<br>mentations</h2>
                </div>
                <span class="project-arrow">→</span>
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> <span id="secretTrigger">Harsen Schmidt — Designer Graphique</span></p>
    </footer>

    <div class="kawaii-hearts" id="kawaiiHearts"></div>

    <div class="secret-search" id="secretSearch">
        <input type="text" id="secretInput" placeholder="...">
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // ========== EASTER EGG 2: Code Konami pour Mode Windows 98 ==========
        let konamiCode = [];
        const konamiSequence = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
        let konamiIndex = 0;
        
        document.addEventListener('keydown', (e) => {
            if (e.key === konamiSequence[konamiIndex]) {
                konamiIndex++;
                console.log(`✓ Touche ${konamiIndex}/${konamiSequence.length} correcte: ${e.key}`);
                
                if (konamiIndex === konamiSequence.length) {
                    document.body.classList.toggle('win98-mode');
                    konamiIndex = 0;
                    
                    if (document.body.classList.contains('win98-mode')) {
                        console.log('💾 Windows 98 mode activé ! Bienvenue en 1998 !');
                        alert('🎮 Code Konami validé ! Windows 98 mode activé !');
                    } else {
                        console.log('💾 Retour au présent !');
                    }
                }
            } else {
                if (konamiIndex > 0) {
                    console.log(`✗ Séquence réinitialisée. Touche attendue: ${konamiSequence[konamiIndex]}, reçue: ${e.key}`);
                }
                konamiIndex = 0;
            }
        });

        // ========== EASTER EGG 3: Barre de recherche secrète ==========
        const secretTrigger = document.getElementById('secretTrigger');
        const secretSearch = document.getElementById('secretSearch');
        const secretInput = document.getElementById('secretInput');
        
        secretTrigger.addEventListener('click', (e) => {
            e.preventDefault();
            secretSearch.classList.toggle('active');
            if (secretSearch.classList.contains('active')) {
                setTimeout(() => secretInput.focus(), 500);
                console.log('🔍 Barre de recherche secrète activée !');
            }
        });

        document.addEventListener('click', (e) => {
            if (!secretSearch.contains(e.target) && e.target !== secretTrigger) {
                secretSearch.classList.remove('active');
            }
        });

        secretInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const value = secretInput.value.toLowerCase().trim();
                
                if (value === 'orlane') {
                    document.body.classList.toggle('kawaii-mode');
                    secretSearch.classList.remove('active');
                    
                    if (document.body.classList.contains('kawaii-mode')) {
                        createKawaiiHearts();
                        console.log('💖 Mode Kawaii activé ! 귀여워 ♡');
                    } else {
                        document.getElementById('kawaiiHearts').innerHTML = '';
                        console.log('💖 Mode Kawaii désactivé');
                    }
                } else if (value === 'harsen') {
                    window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank');
                    secretSearch.classList.remove('active');
                    console.log('🎵 Surprise musicale !');
                } else if (value === 'bardavid') {
                    document.body.classList.add('earthquake');
                    setTimeout(() => {
                        document.body.classList.remove('earthquake');
                    }, 500);
                    secretSearch.classList.remove('active');
                    console.log('🌍 Tremblement de terre activé !');
                } else {
                    alert('Code secret non reconnu.');
                }
                
                secretInput.value = '';
            }
        });

        function createKawaiiHearts() {
            const heartsContainer = document.getElementById('kawaiiHearts');
            const hearts = ['💖', '💗', '💕', '💓', '💝', '🎀', '✨', '🌸'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 6 + 's';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heartsContainer.appendChild(heart);
            }
        }
    </script>
</body>
</html>
