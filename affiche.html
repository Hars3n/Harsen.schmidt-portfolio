<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiches - HARSEN Schmidt</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #FF0033;
        }

        body {
            font-family: 'Source Code Pro', monospace;
            font-variation-settings: 'wght' 400;
            background: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
        }

        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--primary-red);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
        }

        .halftone-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.08;
        }

        .halftone-bg::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.4) 2px, transparent 2px),
                radial-gradient(circle, rgba(255, 0, 51, 0.3) 1.5px, transparent 1.5px);
            background-size: 40px 40px, 60px 60px;
            background-position: 0 0, 30px 30px;
            animation: halftoneFloat 40s ease-in-out infinite;
        }

        @keyframes halftoneFloat {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(20px, -20px) scale(1.05);
            }
            50% {
                transform: translate(-10px, 30px) scale(0.95);
            }
            75% {
                transform: translate(30px, 10px) scale(1.02);
            }
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            z-index: 1000;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            position: relative;
            transition: all 0.3s ease;
        }

        header a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-red);
            transition: width 0.3s ease;
        }

        header a:hover::after {
            width: 100%;
        }

        .container {
            max-width: 1920px;
            margin: 0 auto;
            padding: 140px 100px 80px;
            position: relative;
            z-index: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .page-header h1 {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 100px;
            font-weight: 400;
            letter-spacing: -2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .page-header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: linear-gradient(to right, var(--primary-red), transparent);
        }

        .category-section {
            margin-bottom: 100px;
        }

        .category-header {
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid var(--primary-red);
            backdrop-filter: blur(10px);
        }

        .category-number {
            font-size: 18px;
            color: var(--primary-red);
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .category-title {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 42px;
            font-weight: 400;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--primary-red);
        }

        .category-btn {
            display: inline-block;
            padding: 15px 35px;
            background: var(--primary-red);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .category-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .category-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .category-btn span {
            position: relative;
            z-index: 1;
        }

        .category-btn:hover {
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.6);
            transform: translateY(-2px);
        }

        .pinterest-grid {
            column-count: 4;
            column-gap: 25px;
        }

        .pinterest-item {
            break-inside: avoid;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 0, 51, 0.2);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .pinterest-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary-red);
            box-shadow: 
                0 10px 40px rgba(255, 0, 51, 0.3),
                inset 0 0 60px rgba(255, 0, 51, 0.1);
        }

        .pinterest-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease;
        }

        .pinterest-item:hover img {
            transform: scale(1.05);
        }

        .back-to-top {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 50px;
            height: 50px;
            background: var(--primary-red);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.5);
            border: 2px solid rgba(255, 0, 51, 0.5);
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.7);
        }

        .back-to-top::before {
            content: '↑';
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }

        footer {
            padding: 40px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(10px);
            position: relative;
        }

        footer p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 1400px) {
            .pinterest-grid {
                column-count: 3;
            }
        }

        @media (max-width: 1024px) {
            .container {
                padding: 120px 50px 60px;
            }

            .pinterest-grid {
                column-count: 2;
            }

            .page-header h1 {
                font-size: 70px;
            }

            .category-title {
                font-size: 32px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 100px 20px 40px;
            }

            .pinterest-grid {
                column-count: 1;
            }

            .page-header h1 {
                font-size: 50px;
            }

            .category-title {
                font-size: 28px;
            }

            .pinterest-item-overlay {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="halftone-bg"></div>
    <div class="cursor-dot"></div>
    
    <header>
        <a href="index.html">ACCUEIL</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="contact.html">CONTACT</a>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>AFFICHES</h1>
        </div>

        <!-- Catégorie 1: Affiche de théâtre -->
        <section class="category-section">
            <div class="category-header">
                <div class="category-number">1 - AFFICHE DE THÉÂTRE</div>
                <h2 class="category-title">LARMES DE CROCODILE</h2>
                <a href="croco.html" class="category-btn">
                    <span>En savoir plus</span>
                </a>
            </div>

            <div class="pinterest-grid">
                <div class="pinterest-item">
                    <img src="affiche-croco1.jpg" alt="Larmes de crocodile - Affiche 1">
                </div>
                <div class="pinterest-item">
                    <img src="affiche-croco2.jpg" alt="Larmes de crocodile - Affiche 2">
                </div>
                <div class="pinterest-item">
                    <img src="affiche-croco3.jpg" alt="Larmes de crocodile - Affiche 3">
                </div>
            </div>
        </section>

        <!-- Catégorie 2: Affiche typographique -->
        <section class="category-section">
            <div class="category-header">
                <div class="category-number">2 - AFFICHE TYPOGRAPHIQUE</div>
                <h2 class="category-title">TYPOGRAPHISME</h2>
                <a href="macro1.html" class="category-btn">
                    <span>En savoir plus</span>
                </a>
            </div>

            <div class="pinterest-grid">
                <div class="pinterest-item">
                    <img src="affiche-m1.jpg" alt="Typographisme - Affiche">
                </div>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> Harsen Schmidt — Designer Graphique</p>
    </footer>

    <div class="back-to-top" id="backToTop"></div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const cursorDot = document.querySelector('.cursor-dot');
        document.addEventListener('mousemove', (e) => {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
        });

        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });

        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '0';
                    entry.target.style.transform = 'translateY(20px)';
                    setTimeout(() => {
                        entry.target.style.transition = 'all 0.6s ease';
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }, 100);
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.pinterest-item').forEach(item => {
            observer.observe(item);
        });
    </script>
</body>
</html>
