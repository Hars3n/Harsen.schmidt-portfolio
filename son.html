<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualiseur Audio Génératif - HARSEN Schmidt</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo+Black&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #FF0033;
            --secondary-accent: #00ff88;
            --tertiary-accent: #ff00ff;
            --panel-bg: rgba(20, 20, 20, 0.95);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-mode {
            --bg-color: #f5f5f0;
            --text-color: #0a0a0a;
            --panel-bg: rgba(255, 255, 255, 0.95);
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 0, 51, 0.2);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        header.hidden {
            transform: translateY(-100%);
        }

        .header-title {
            font-family: 'Archivo Black', sans-serif;
            font-size: 16px;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
        }

        .header-links {
            display: flex;
            gap: 25px;
        }

        header a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            opacity: 0.7;
            position: relative;
        }

        header a:hover {
            color: var(--accent-color);
            opacity: 1;
        }

        header a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-color);
            transition: width 0.3s ease;
        }

        header a:hover::after {
            width: 100%;
        }

        .container {
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 380px;
            padding-top: 70px;
        }

        .visualization-area {
            position: relative;
            overflow: hidden;
            background: var(--bg-color);
        }

        .control-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 0, 51, 0.2);
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .control-section {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
        }

        .control-section:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 0, 51, 0.3);
        }

        .control-section h3 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .upload-zone {
            border: 2px dashed rgba(255, 0, 51, 0.3);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
            font-size: 11px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .upload-zone::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 0, 51, 0.1) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            transition: all 0.6s ease;
        }

        .upload-zone:hover::before {
            width: 300px;
            height: 300px;
        }

        .upload-zone:hover {
            background: rgba(255, 0, 51, 0.05);
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        .upload-zone.dragover {
            background: rgba(255, 0, 51, 0.1);
            border-color: var(--secondary-accent);
            transform: scale(1.02);
        }

        input[type="file"] {
            display: none;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 16px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 0, 51, 0.2);
            transform: translate(-50%, -50%);
            transition: all 0.4s ease;
            border-radius: 50%;
        }

        button:hover:not(:disabled)::before {
            width: 300px;
            height: 300px;
        }

        button:hover:not(:disabled) {
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 51, 0.2);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        button.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.4);
        }

        .slider-control {
            margin-top: 10px;
        }

        .slider-control label {
            display: block;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
        }

        input[type="range"] {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent-color);
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
            transition: all 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.8);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--accent-color);
            cursor: pointer;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
        }

        input[type="text"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255, 0, 51, 0.05);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.2);
        }

        .mode-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .mode-buttons button {
            padding: 10px 8px;
            font-size: 10px;
        }

        .theme-toggle {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .theme-toggle button {
            flex: 1;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .preset-buttons button {
            font-size: 10px;
            padding: 10px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #waterfallCanvas {
            opacity: 0.3;
            z-index: 1;
            transition: opacity 0.3s ease;
        }

        #waterfallCanvas.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #generativeCanvas {
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        #generativeCanvas.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--accent-color);
            border: none;
            border-radius: 50%;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 25px rgba(255, 0, 51, 0.4);
        }

        .fullscreen-btn:hover {
            transform: scale(1.15) rotate(90deg);
            box-shadow: 0 10px 40px rgba(255, 0, 51, 0.6);
        }

        .fullscreen-btn:active {
            transform: scale(1.05) rotate(90deg);
        }

        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 1px;
            z-index: 999;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .frequency-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, 
                var(--accent-color) 0%, 
                var(--tertiary-accent) 50%,
                var(--secondary-accent) 100%
            );
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.1s ease;
            z-index: 998;
            box-shadow: 0 -2px 20px rgba(255, 0, 51, 0.5);
        }

        .stats {
            position: fixed;
            top: 80px;
            left: 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Space Mono', monospace;
            z-index: 999;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .stats.visible {
            display: block;
        }

        .color-picker-wrapper {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .color-picker-wrapper label {
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            flex: 1;
        }

        input[type="color"] {
            width: 50px;
            height: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            cursor: pointer;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }

            .control-panel {
                position: fixed;
                top: 70px;
                right: -380px;
                bottom: 0;
                width: 380px;
                transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 900;
                box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            }

            .control-panel.visible {
                right: 0;
            }

            .menu-toggle {
                position: fixed;
                top: 80px;
                right: 20px;
                width: 50px;
                height: 50px;
                background: var(--accent-color);
                border: none;
                border-radius: 50%;
                color: #000;
                font-size: 20px;
                cursor: pointer;
                z-index: 1001;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 5px 25px rgba(255, 0, 51, 0.4);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-accent);
        }

        /* Loading animation */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            font-family: 'Archivo Black', sans-serif;
            font-size: 24px;
            letter-spacing: 3px;
            color: var(--accent-color);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-text">INITIALISATION...</div>
    </div>

    <header id="header">
        <div class="header-title">VISUALISEUR GÉNÉRATIF</div>
        <div class="header-links">
            <a href="index.html">ACCUEIL</a>
            <a href="portfolio.html">PORTFOLIO</a>
            <a href="contact.html">CONTACT</a>
        </div>
    </header>

    <div class="container">
        <div class="visualization-area">
            <canvas id="waterfallCanvas"></canvas>
            <canvas id="generativeCanvas"></canvas>
        </div>

        <div class="control-panel" id="controlPanel">
            <!-- Audio Section -->
            <div class="control-section">
                <h3>Audio</h3>
                <div class="upload-zone" id="uploadZone">
                    Glissez un MP3 ou cliquez
                    <input type="file" id="fileInput" accept=".mp3,audio/mpeg">
                </div>
                <div class="controls">
                    <button id="playBtn" disabled>▶ Play</button>
                    <button id="pauseBtn" disabled>⏸ Pause</button>
                    <button id="stopBtn" disabled>⏹ Stop</button>
                </div>
            </div>

            <!-- Theme Section -->
            <div class="control-section">
                <h3>Thème</h3>
                <div class="theme-toggle">
                    <button id="darkBtn" class="active">Sombre</button>
                    <button id="lightBtn">Clair</button>
                </div>
            </div>

            <!-- Display Toggles Section -->
            <div class="control-section">
                <h3>Affichage</h3>
                <div class="theme-toggle">
                    <button id="generativeToggle" class="active">Génératif</button>
                    <button id="waterfallToggle" class="active">Waterfall</button>
                </div>
            </div>

            <!-- Generation Mode Section -->
            <div class="control-section">
                <h3>Mode de génération</h3>
                <div class="mode-buttons">
                    <button id="mode1" class="active">Onde</button>
                    <button id="mode2">Spirale</button>
                    <button id="mode3">Chaos</button>
                    <button id="mode4">Fractale</button>
                    <button id="mode5">Flux</button>
                    <button id="mode6">Glitch</button>
                </div>
            </div>

            <!-- Custom Text Section -->
            <div class="control-section">
                <h3>Texte personnalisé</h3>
                <input type="text" id="customText" placeholder="GO" value="GO" maxlength="20">
            </div>

            <!-- Speed Control Section -->
            <div class="control-section">
                <h3>Vitesse</h3>
                <div class="slider-control">
                    <label>Vitesse d'exécution: <span id="speedValue">1.0x</span></label>
                    <input type="range" id="speedSlider" min="0.5" max="3" step="0.1" value="1">
                </div>
            </div>

            <!-- Sensitivity Section -->
            <div class="control-section">
                <h3>Sensibilité audio</h3>
                <div class="slider-control">
                    <label>Réactivité: <span id="sensitivityValue">1.0x</span></label>
                    <input type="range" id="sensitivitySlider" min="0.5" max="3" step="0.1" value="1">
                </div>
            </div>

            <!-- Particle Density Section -->
            <div class="control-section">
                <h3>Densité</h3>
                <div class="slider-control">
                    <label>Particules: <span id="densityValue">Medium</span></label>
                    <input type="range" id="densitySlider" min="1" max="5" step="1" value="3">
                </div>
            </div>

            <!-- Color Controls -->
            <div class="control-section">
                <h3>Couleurs</h3>
                <div class="color-picker-wrapper">
                    <label>Accent</label>
                    <input type="color" id="accentColor" value="#FF0033">
                </div>
                <div class="color-picker-wrapper">
                    <label>Secondaire</label>
                    <input type="color" id="secondaryColor" value="#00ff88">
                </div>
            </div>

            <!-- Presets Section -->
            <div class="control-section">
                <h3>Presets</h3>
                <div class="preset-buttons">
                    <button id="preset1">Cyber</button>
                    <button id="preset2">Rétro</button>
                    <button id="preset3">Minimal</button>
                    <button id="preset4">Psyché</button>
                </div>
            </div>

            <!-- Stats Toggle -->
            <div class="control-section">
                <button id="statsBtn">Stats Performance</button>
            </div>
        </div>
    </div>

    <button class="fullscreen-btn" id="fullscreenBtn" title="Plein écran">⛶</button>
    <div class="info" id="info">Prêt</div>
    <div class="stats" id="stats">
        <div>FPS: <span id="fps">0</span></div>
        <div>Particules: <span id="particleCount">0</span></div>
        <div>Fréquence moy: <span id="avgFreq">0</span></div>
    </div>
    <div class="frequency-bar" id="frequencyBar"></div>

    <audio id="audio"></audio>

    <!-- Le fichier JavaScript externe -->
    <script src="audio-visualizer.js"></script>
</body>
</html>
