<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expérimentation - HARSEN Schmidt</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #FF0033;
        }

        body {
            font-family: 'Source Code Pro', monospace;
            background: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
        }

        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--primary-red);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            z-index: 1000;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            position: relative;
            transition: all 0.3s ease;
        }

        header a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-red);
            transition: width 0.3s ease;
        }

        header a:hover::after {
            width: 100%;
        }

        .container {
            max-width: 1920px;
            margin: 0 auto;
            padding: 140px 100px 80px;
            position: relative;
            z-index: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .page-header h1 {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 100px;
            font-weight: 400;
            letter-spacing: -2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .page-header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: linear-gradient(to right, var(--primary-red), transparent);
        }

        .page-header p {
            font-size: 20px;
            color: #e0e0e0;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .toggle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0 50px;
            gap: 15px;
        }

        .toggle-switch {
            position: relative;
            width: 70px;
            height: 34px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 34px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .toggle-switch:hover {
            border-color: var(--primary-red);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.4s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .toggle-switch.active {
            background: var(--primary-red);
            border-color: var(--primary-red);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.5);
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(36px);
        }

        .toggle-help {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            max-width: 400px;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.4s ease;
        }

        .toggle-help.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .pinterest-grid {
            column-count: 4;
            column-gap: 25px;
        }

        .pinterest-item {
            break-inside: avoid;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 0, 51, 0.2);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .pinterest-item.placeholder {
            opacity: 0.3;
            pointer-events: none;
        }

        .pinterest-item.draggable {
            cursor: grab;
        }

        .pinterest-item.dragging {
            cursor: grabbing;
            position: fixed !important;
            z-index: 1000 !important;
            box-shadow: 0 20px 60px rgba(255, 0, 51, 0.5);
            border-color: var(--primary-red);
        }

        .pinterest-item:not(.draggable):hover {
            transform: translateY(-5px);
            border-color: var(--primary-red);
            box-shadow: 0 10px 40px rgba(255, 0, 51, 0.3);
        }

        .pinterest-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .pinterest-item:not(.draggable):hover img {
            transform: scale(1.05);
            transition: transform 0.4s ease;
        }

        .back-to-top {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 50px;
            height: 50px;
            background: var(--primary-red);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.5);
            border: 2px solid rgba(255, 0, 51, 0.5);
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.7);
        }

        .back-to-top::before {
            content: '↑';
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }

        footer {
            padding: 40px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(10px);
            position: relative;
        }

        footer p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .footer-note {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        @media (max-width: 1400px) {
            .pinterest-grid {
                column-count: 3;
            }
        }

        @media (max-width: 1024px) {
            .container {
                padding: 120px 50px 60px;
            }

            .pinterest-grid {
                column-count: 2;
            }

            .page-header h1 {
                font-size: 70px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 100px 20px 40px;
            }

            .pinterest-grid {
                column-count: 1;
            }

            .page-header h1 {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="cursor-dot"></div>
    
    <header>
        <a href="index.html">ACCUEIL</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="contact.html">CONTACT</a>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>EXPÉRIMENTATION</h1>
            <p>Galerie Pratique Expérimentale</p>
        </div>

        <div class="toggle-container">
            <div class="toggle-switch" id="toggleSwitch">
                <div class="toggle-slider"></div>
            </div>
            <div class="toggle-help" id="toggleHelp">
                Vous pouvez déplacer les images et les zoomer grâce à ce mode
            </div>
        </div>

        <div class="pinterest-grid" id="gallery"></div>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> Harsen Schmidt — Designer Graphique</p>
        <p class="footer-note">Galerie d'expérimentation interactive aléatoire</p>
    </footer>

    <div class="back-to-top" id="backToTop"></div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const cursorDot = document.querySelector('.cursor-dot');
        document.addEventListener('mousemove', (e) => {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
        });

        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('visible', window.scrollY > 300);
        });

        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Galerie optimisée
        const gallery = document.getElementById('gallery');
        const imageCount = 30;

        function shuffleArray(arr) {
            const result = [...arr];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function initGallery() {
            const order = shuffleArray([...Array(imageCount).keys()].map(i => i + 1));
            const fragment = document.createDocumentFragment();
            
            order.forEach(num => {
                const item = document.createElement('div');
                item.className = 'pinterest-item';
                const img = document.createElement('img');
                img.src = `expe-${num}.jpg`;
                img.alt = `Expérimentation ${num}`;
                img.loading = 'lazy';
                item.appendChild(img);
                fragment.appendChild(item);
            });
            
            gallery.innerHTML = '';
            gallery.appendChild(fragment);
        }

        initGallery();

        // Mode interactif
        let interactiveMode = false;
        let isDragging = false;
        let currentItem = null;
        let startX, startY;
        let movedItems = new Map();
        let scales = new Map();

        const toggleSwitch = document.getElementById('toggleSwitch');
        const toggleHelp = document.getElementById('toggleHelp');

        toggleSwitch.addEventListener('click', () => {
            interactiveMode = !interactiveMode;
            toggleSwitch.classList.toggle('active');
            toggleHelp.classList.toggle('visible', interactiveMode);
            
            const items = document.querySelectorAll('.pinterest-item');
            
            if (interactiveMode) {
                items.forEach(item => {
                    if (!movedItems.has(item)) {
                        item.classList.add('draggable');
                    }
                });
            } else {
                movedItems.clear();
                scales.clear();
                items.forEach(item => {
                    item.className = 'pinterest-item';
                    item.style.cssText = '';
                    const img = item.querySelector('img');
                    if (img) img.style.cssText = '';
                });
                initGallery();
            }
        });

        // Drag & Drop
        gallery.addEventListener('mousedown', (e) => {
            if (!interactiveMode) return;
            const item = e.target.closest('.pinterest-item');
            if (!item || item.classList.contains('placeholder')) return;

            isDragging = true;
            currentItem = item;
            
            const rect = item.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            if (!movedItems.has(item)) {
                const placeholder = item.cloneNode(true);
                placeholder.className = 'pinterest-item placeholder';
                item.parentNode.insertBefore(placeholder, item);
                movedItems.set(item, { rect, scale: 1 });
                scales.set(item, 1);
            }

            item.classList.add('dragging');
            item.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;z-index:1000`;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || !currentItem) return;
            const scale = scales.get(currentItem) || 1;
            currentItem.style.left = (e.clientX - startX * scale) + 'px';
            currentItem.style.top = (e.clientY - startY * scale) + 'px';
        });

        document.addEventListener('mouseup', () => {
            if (currentItem) {
                currentItem.classList.remove('dragging');
                currentItem.style.zIndex = '100';
            }
            isDragging = false;
            currentItem = null;
        });

        // Zoom - molette + pavé tactile
        function handleZoom(e, item) {
            if (!interactiveMode || !isDragging || !item) return;
            e.preventDefault();

            const img = item.querySelector('img');
            if (!img) return;

            let scale = scales.get(item) || 1;
            const delta = e.deltaY > 0 ? -0.15 : 0.15;
            scale = Math.min(Math.max(0.3, scale + delta), 4);
            scales.set(item, scale);

            const data = movedItems.get(item);
            if (data) {
                const newW = data.rect.width * scale;
                const newH = data.rect.height * scale;
                const rect = item.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                item.style.width = newW + 'px';
                item.style.height = newH + 'px';
                item.style.left = (centerX - newW / 2) + 'px';
                item.style.top = (centerY - newH / 2) + 'px';
            }
        }

        document.addEventListener('wheel', (e) => handleZoom(e, currentItem), { passive: false });
        
        // Support pavé tactile
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && currentItem) {
                e.preventDefault();
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                const dist = Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);
                
                if (!currentItem.lastPinchDist) {
                    currentItem.lastPinchDist = dist;
                    return;
                }
                
                const delta = dist - currentItem.lastPinchDist;
                handleZoom({ deltaY: -delta, preventDefault: () => {} }, currentItem);
                currentItem.lastPinchDist = dist;
            }
        }, { passive: false });

        document.addEventListener('touchend', () => {
            if (currentItem) currentItem.lastPinchDist = null;
        });
    </script>
</body>
</html>
