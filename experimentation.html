<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expérimentation - HARSEN Schmidt</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #FF0033;
        }

        body {
            font-family: 'Source Code Pro', monospace;
            background: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--primary-red);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            z-index: 1000;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            position: relative;
            transition: all 0.3s ease;
        }

        header a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-red);
            transition: width 0.3s ease;
        }

        header a:hover::after {
            width: 100%;
        }

        .container {
            max-width: 1920px;
            margin: 0 auto;
            padding: 140px 100px 80px;
            position: relative;
            z-index: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .page-header h1 {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 100px;
            font-weight: 400;
            letter-spacing: -2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .page-header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: linear-gradient(to right, var(--primary-red), transparent);
        }

        .page-header p {
            font-size: 20px;
            color: #e0e0e0;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .toggle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0 50px;
            gap: 15px;
        }

        .toggle-switch {
            position: relative;
            width: 70px;
            height: 34px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 34px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .toggle-switch:hover {
            border-color: var(--primary-red);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.4s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .toggle-switch.active {
            background: var(--primary-red);
            border-color: var(--primary-red);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.5);
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(36px);
        }

        .toggle-help {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            max-width: 400px;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.4s ease;
        }

        .toggle-help.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .pinterest-grid {
            column-count: 4;
            column-gap: 25px;
        }

        .pinterest-item {
            break-inside: avoid;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 0, 51, 0.2);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .pinterest-item.placeholder {
            opacity: 0.3;
            pointer-events: none;
        }

        .pinterest-item.draggable {
            cursor: pointer;
        }

        .pinterest-item.selected {
            border: 3px solid var(--primary-red);
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.6);
            cursor: move;
            z-index: 100;
        }

        .pinterest-item:not(.draggable):hover {
            transform: translateY(-5px);
            border-color: var(--primary-red);
            box-shadow: 0 10px 40px rgba(255, 0, 51, 0.3);
        }

        .pinterest-item img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        .pinterest-item:not(.draggable):hover img {
            transform: scale(1.05);
            transition: transform 0.4s ease;
        }

        .back-to-top {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 50px;
            height: 50px;
            background: var(--primary-red);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.5);
            border: 2px solid rgba(255, 0, 51, 0.5);
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.7);
        }

        .back-to-top::before {
            content: '↑';
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }

        footer {
            padding: 40px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(10px);
            position: relative;
        }

        footer p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .footer-note {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        @media (max-width: 1400px) {
            .pinterest-grid {
                column-count: 3;
            }
        }

        @media (max-width: 1024px) {
            .container {
                padding: 120px 50px 60px;
            }

            .pinterest-grid {
                column-count: 2;
            }

            .page-header h1 {
                font-size: 70px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 100px 20px 40px;
            }

            .pinterest-grid {
                column-count: 1;
            }

            .page-header h1 {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="cursor-dot"></div>
    
    <header>
        <a href="index.html">ACCUEIL</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="contact.html">CONTACT</a>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>EXPÉRIMENTATION</h1>
            <p>Galerie Pratique Expérimentale</p>
        </div>

        <div class="toggle-container">
            <div class="toggle-switch" id="toggleSwitch">
                <div class="toggle-slider"></div>
            </div>
            <div class="toggle-help" id="toggleHelp">
                Clic simple pour sélectionner et zoomer · Double-clic pour désélectionner
            </div>
        </div>

        <div class="pinterest-grid" id="gallery"></div>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> Harsen Schmidt — Designer Graphique</p>
        <p class="footer-note">Galerie d'expérimentation interactive aléatoire</p>
    </footer>

    <div class="back-to-top" id="backToTop"></div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const cursorDot = document.querySelector('.cursor-dot');
        document.addEventListener('mousemove', (e) => {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
        });

        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('visible', window.scrollY > 300);
        });

        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Galerie optimisée
        const gallery = document.getElementById('gallery');
        const imageCount = 30;

        function shuffleArray(arr) {
            const result = [...arr];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function initGallery() {
            const order = shuffleArray([...Array(imageCount).keys()].map(i => i + 1));
            const fragment = document.createDocumentFragment();
            
            order.forEach(num => {
                const item = document.createElement('div');
                item.className = 'pinterest-item';
                const img = document.createElement('img');
                img.src = `expe-${num}.jpg`;
                img.alt = `Expérimentation ${num}`;
                img.loading = 'lazy';
                item.appendChild(img);
                fragment.appendChild(item);
            });
            
            gallery.innerHTML = '';
            gallery.appendChild(fragment);
        }

        initGallery();

        // Mode interactif
        let interactiveMode = false;
        let selectedItem = null;
        let isDragging = false;
        let startX, startY;
        let movedItems = new Map();
        let scales = new Map();

        const toggleSwitch = document.getElementById('toggleSwitch');
        const toggleHelp = document.getElementById('toggleHelp');

        toggleSwitch.addEventListener('click', () => {
            interactiveMode = !interactiveMode;
            toggleSwitch.classList.toggle('active');
            toggleHelp.classList.toggle('visible', interactiveMode);
            
            const items = document.querySelectorAll('.pinterest-item');
            
            if (interactiveMode) {
                items.forEach(item => item.classList.add('draggable'));
            } else {
                // Réinitialiser tout
                selectedItem = null;
                movedItems.clear();
                scales.clear();
                items.forEach(item => {
                    item.className = 'pinterest-item';
                    item.style.cssText = '';
                    const img = item.querySelector('img');
                    if (img) img.style.cssText = '';
                });
                initGallery();
            }
        });

        // Sélection d'image avec simple clic
        gallery.addEventListener('click', (e) => {
            if (!interactiveMode) return;
            if (isDragging) return;
            
            const item = e.target.closest('.pinterest-item');
            if (!item || item.classList.contains('placeholder')) return;

            // Si c'est déjà sélectionné, ne rien faire (attendre le double-clic)
            if (selectedItem === item) {
                return;
            }

            // Désélectionner l'ancien item
            if (selectedItem) {
                selectedItem.classList.remove('selected');
            }

            // Sélectionner le nouveau
            selectedItem = item;
            item.classList.add('selected');

            // Initialiser les données si première fois
            if (!movedItems.has(item)) {
                const rect = item.getBoundingClientRect();
                
                // Créer placeholder
                const placeholder = item.cloneNode(true);
                placeholder.className = 'pinterest-item placeholder';
                item.parentNode.insertBefore(placeholder, item);
                
                movedItems.set(item, { 
                    rect,
                    placeholder
                });
                scales.set(item, 1);

                // Positionner en fixed
                item.style.position = 'fixed';
                item.style.left = rect.left + 'px';
                item.style.top = rect.top + 'px';
                item.style.width = rect.width + 'px';
                item.style.zIndex = '100';
            }
        });

        // Désélection avec double-clic
        gallery.addEventListener('dblclick', (e) => {
            if (!interactiveMode || !selectedItem) return;
            
            const item = e.target.closest('.pinterest-item');
            if (item !== selectedItem) return;

            item.classList.remove('selected');
            
            // Retour à la position d'origine
            const data = movedItems.get(item);
            if (data) {
                item.style.transition = 'all 0.4s ease';
                item.style.left = data.rect.left + 'px';
                item.style.top = data.rect.top + 'px';
                item.style.width = data.rect.width + 'px';
                
                // Après l'animation, supprimer le placeholder et réinitialiser
                setTimeout(() => {
                    if (data.placeholder && data.placeholder.parentNode) {
                        data.placeholder.remove();
                    }
                    item.style.cssText = '';
                    item.style.transition = '';
                    movedItems.delete(item);
                    scales.delete(item);
                }, 400);
            }
            
            selectedItem = null;
        });

        // Drag avec mousedown/move/up
        let dragStarted = false;

        gallery.addEventListener('mousedown', (e) => {
            if (!interactiveMode || !selectedItem) return;
            
            const item = e.target.closest('.pinterest-item');
            if (item !== selectedItem) return;

            isDragging = true;
            dragStarted = false;
            
            const rect = item.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || !selectedItem) return;
            
            dragStarted = true;
            const scale = scales.get(selectedItem) || 1;
            selectedItem.style.left = (e.clientX - startX * scale) + 'px';
            selectedItem.style.top = (e.clientY - startY * scale) + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            // Petit délai pour éviter que le clic de mouseup ne déclenche la désélection
            setTimeout(() => {
                dragStarted = false;
            }, 10);
        });

        // Zoom - uniquement sur l'item sélectionné
        function handleZoom(e) {
            if (!interactiveMode || !selectedItem) return;
            e.preventDefault();

            let scale = scales.get(selectedItem) || 1;
            const delta = e.deltaY > 0 ? -0.08 : 0.08; // Zoom plus lent
            scale = Math.min(Math.max(0.3, scale + delta), 4);
            scales.set(selectedItem, scale);

            const data = movedItems.get(selectedItem);
            if (data) {
                // Garder la position actuelle lors du zoom
                const currentLeft = parseFloat(selectedItem.style.left);
                const currentTop = parseFloat(selectedItem.style.top);
                const currentWidth = parseFloat(selectedItem.style.width);
                const currentHeight = parseFloat(selectedItem.style.height);
                
                const newW = data.rect.width * scale;
                const newH = data.rect.height * scale;
                
                // Calculer le décalage pour garder le centre au même endroit
                const offsetX = (newW - currentWidth) / 2;
                const offsetY = (newH - currentHeight) / 2;
                
                selectedItem.style.width = newW + 'px';
                selectedItem.style.height = newH + 'px';
                selectedItem.style.left = (currentLeft - offsetX) + 'px';
                selectedItem.style.top = (currentTop - offsetY) + 'px';
            }
        }

        // Empêcher le scroll de la page uniquement si une image est sélectionnée
        document.addEventListener('wheel', (e) => {
            if (interactiveMode && selectedItem) {
                handleZoom(e);
            }
        }, { passive: false });
        
        // Support pavé tactile (pinch-to-zoom)
        let lastPinchDist = null;

        document.addEventListener('touchmove', (e) => {
            if (!interactiveMode || !selectedItem) return;
            
            if (e.touches.length === 2) {
                e.preventDefault();
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                const dist = Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);
                
                if (!lastPinchDist) {
                    lastPinchDist = dist;
                    return;
                }
                
                const delta = (dist - lastPinchDist) * 0.5; // Réduire la vitesse
                
                // Utiliser la même logique que handleZoom
                let scale = scales.get(selectedItem) || 1;
                const scaleChange = delta > 0 ? 0.08 : -0.08;
                scale = Math.min(Math.max(0.3, scale + scaleChange), 4);
                scales.set(selectedItem, scale);

                const data = movedItems.get(selectedItem);
                if (data) {
                    const currentLeft = parseFloat(selectedItem.style.left);
                    const currentTop = parseFloat(selectedItem.style.top);
                    const currentWidth = parseFloat(selectedItem.style.width);
                    const currentHeight = parseFloat(selectedItem.style.height);
                    
                    const newW = data.rect.width * scale;
                    const newH = data.rect.height * scale;
                    
                    const offsetX = (newW - currentWidth) / 2;
                    const offsetY = (newH - currentHeight) / 2;
                    
                    selectedItem.style.width = newW + 'px';
                    selectedItem.style.height = newH + 'px';
                    selectedItem.style.left = (currentLeft - offsetX) + 'px';
                    selectedItem.style.top = (currentTop - offsetY) + 'px';
                }
                
                lastPinchDist = dist;
            }
        }, { passive: false });

        document.addEventListener('touchend', () => {
            lastPinchDist = null;
        });
    </script>
</body>
</html>
