<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARSEN Schmidt - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Imperial+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/old-london" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Code Pro', monospace;
            background: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
        }

        :root {
            --primary-red: #FF0033;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            z-index: 1000;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        header a:hover {
            color: var(--primary-red);
        }

        /* Container principal */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* Section Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 120px 0 80px;
        }

        /* Nom principal */
        .name-container {
            margin-bottom: 40px;
            text-align: center;
        }

        .name {
            font-size: 90px;
            font-weight: 400;
            letter-spacing: -2px;
            cursor: default;
            display: inline-block;
            text-transform: uppercase;
            line-height: 1.1;
            color: #fff;
        }

        .name.first-name {
            display: block;
            margin-bottom: 5px;
        }

        .name.last-name {
            display: block;
            font-size: 60px;
        }

        .name span {
            display: inline-block;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .name span:hover {
            transform: translateY(-5px);
        }

        /* Description */
        .description {
            font-family: 'Source Code Pro', monospace;
            font-size: 16px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 50px;
            color: #e0e0e0;
            font-weight: 300;
        }

        /* Box stage */
        .stage-box {
            background: rgba(255, 0, 51, 0.1);
            color: var(--primary-red);
            padding: 25px 40px;
            border: 2px solid var(--primary-red);
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .stage-box:hover {
            background: rgba(255, 0, 51, 0.15);
        }

        .contact-btn {
            display: inline-block;
            background: var(--primary-red);
            color: #fff;
            padding: 15px 35px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .contact-btn:hover {
            background: #fff;
            color: var(--primary-red);
        }

        /* Section Projets */
        .projects-section {
            padding: 80px 0 100px;
            text-align: center;
        }

        .projects-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 36px;
            font-weight: 400;
            color: #fff;
            margin-bottom: 60px;
            letter-spacing: 2px;
        }

        .projects-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 60px;
            flex-wrap: wrap;
        }

        .category-card {
            width: 280px;
            height: 200px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 0, 51, 0.3);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            padding: 20px;
        }

        .category-card:hover {
            background: rgba(255, 0, 51, 0.1);
            border-color: var(--primary-red);
            transform: translateY(-5px);
        }

        .discover-btn {
            display: inline-block;
            padding: 20px 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .discover-btn:hover {
            background: rgba(255, 0, 51, 0.1);
            border-color: var(--primary-red);
            color: var(--primary-red);
        }
    </style>
</head>
<body>
    <header>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="contact.html">CONTACT</a>
    </header>

    <div class="container">
        <section class="hero">
            <div class="name-container">
                <div class="name first-name">
                    <span>H</span><span>A</span><span>R</span><span>S</span><span>E</span><span>N</span>
                </div>
                <div class="name last-name">
                    <span>S</span><span>C</span><span>H</span><span>M</span><span>I</span><span>D</span><span>T</span>
                </div>
            </div>

            <p class="description">
                Étudiant en 2<sup>e</sup> année DNMADe graphisme à l'Initiative Paris
            </p>

            <div class="stage-box">
                RECHERCHE UN STAGE DE 3 MOIS<br>
                DU 27 AVRIL AU 27 JUILLET 2026
            </div>
            
            <a href="contact.html" class="contact-btn">ME CONTACTER</a>
        </section>

        <section class="projects-section">
            <h2 class="projects-title">MES PROJETS</h2>
            
            <div class="projects-grid">
                <a href="identite.html" class="category-card">
                    <span>IDENTITÉ VISUELLE</span>
                </a>
                <a href="affiche-edition.html" class="category-card">
                    <span>AFFICHES / ÉDITIONS</span>
                </a>
                <a href="experimentation.html" class="category-card">
                    <span>EXPÉRIMENTATIONS</span>
                </a>
            </div>

            <a href="portfolio.html" class="discover-btn">DÉCOUVRIR PLUS →</a>
        </section>
    </div>

    <script>
        // Système de changement de typographies pour les lettres
        const fontFamilies = [
            { name: 'Old London', family: '"Old London", serif', style: 'normal', weight: '400' },
            { name: 'Helvetica Bold', family: '"Helvetica Neue", Helvetica, Arial, sans-serif', style: 'normal', weight: '700' },
            { name: 'Times New Roman Italic', family: '"Times New Roman", Times, serif', style: 'italic', weight: '400' },
            { name: 'Courier New', family: '"Courier New", Courier, monospace', style: 'normal', weight: '400' },
            { name: 'Pixelify Sans', family: '"Pixelify Sans", cursive', style: 'normal', weight: '700' },
            { name: 'Imperial Script', family: '"Imperial Script", cursive', style: 'normal', weight: '400' }
        ];

        // Appliquer le changement de typo aux lettres de façon aléatoire
        document.querySelectorAll('.name span').forEach((span) => {
            span.addEventListener('click', function() {
                const randomIndex = Math.floor(Math.random() * fontFamilies.length);
                const selectedFont = fontFamilies[randomIndex];
                
                span.style.fontFamily = selectedFont.family;
                span.style.fontStyle = selectedFont.style;
                span.style.fontWeight = selectedFont.weight;
                
                span.style.transform = 'scale(1.1) translateY(-10px)';
                setTimeout(() => {
                    span.style.transform = 'scale(1) translateY(0)';
                }, 200);
            });
        });
    </script>
</body>
</html>
