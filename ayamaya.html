<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identité visuelle - Ayamaya</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #FF0033;
        }

        body {
            font-family: 'Source Code Pro', monospace;
            background: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
        }

        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--primary-red);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            padding: 10px 20px;
            border: 2px solid transparent;
        }

        .back-button:hover {
            color: var(--primary-red);
            border-color: var(--primary-red);
        }

        .back-button::before {
            content: '←';
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .back-button:hover::before {
            transform: translateX(-5px);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-red);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 180px 80px 80px;
        }

        .project-hero {
            text-align: center;
            margin-bottom: 60px;
        }

        .project-title {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.6);
        }

        .project-subtitle {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 120px;
            font-weight: 400;
            letter-spacing: -2px;
            text-transform: uppercase;
            line-height: 1.1;
            color: var(--primary-red);
        }

        .hero-image {
            width: 100%;
            max-width: 1800px;
            height: auto;
            margin: 60px auto;
            display: block;
            transition: all 0.5s ease;
        }

        .hero-image:hover {
            transform: scale(1.02);
            filter: drop-shadow(0 20px 60px rgba(255, 0, 51, 0.4));
        }

        .description-box {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 0, 51, 0.3);
            padding: 40px 60px;
            margin: 60px auto;
            max-width: 1400px;
            transition: all 0.3s ease;
        }

        .description-box:hover {
            border-color: var(--primary-red);
            box-shadow: 0 10px 40px rgba(255, 0, 51, 0.2);
        }

        .description-item {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }

        .description-item:last-child {
            margin-bottom: 0;
        }

        .description-label {
            font-size: 16px;
            color: var(--primary-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            min-width: 150px;
        }

        .description-value {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 80px 0;
            max-width: 1500px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 0, 51, 0.2);
            aspect-ratio: 1;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .research-section {
            margin: 80px auto;
            max-width: 1400px;
        }

        .research-toggle {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 0, 51, 0.3);
            padding: 30px 40px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            user-select: none;
        }

        .research-toggle:hover {
            border-color: var(--primary-red);
            background: rgba(255, 0, 51, 0.1);
        }

        .research-toggle-text {
            font-size: 32px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary-red);
        }

        .research-toggle-arrow {
            font-size: 28px;
            color: var(--primary-red);
            transition: transform 0.3s ease;
        }

        .research-toggle-arrow.open {
            transform: rotate(180deg);
        }

        .research-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .research-content.open {
            max-height: 50000px;
        }

        .research-inner {
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(255, 0, 51, 0.2);
            border-top: none;
        }

        .pdf-page {
            width: 100%;
            max-width: 800px;
            height: auto;
            margin: 0 auto 40px auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: block;
        }

        .pdf-page:last-child {
            margin-bottom: 0;
        }

        footer {
            padding: 40px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(26, 26, 26, 0.8);
            margin-top: 80px;
        }

        footer p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 1024px) {
            .container {
                padding: 120px 50px 60px;
            }

            .project-title {
                font-size: 28px;
            }

            .project-subtitle {
                font-size: 70px;
            }

            .image-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 100px 20px 40px;
            }

            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            .project-title {
                font-size: 24px;
            }

            .project-subtitle {
                font-size: 50px;
            }

            .image-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .description-box {
                padding: 30px 20px;
            }

            .description-item {
                flex-direction: column;
                gap: 8px;
            }

            .research-toggle {
                padding: 20px;
            }

            .research-toggle-text {
                font-size: 24px;
            }

            .research-inner {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="cursor-dot"></div>
    
    <header>
        <a href="affiche-edition.html" class="back-button">
            <span>Retour</span>
        </a>
        <div class="nav-links">
            <a href="index.html">ACCUEIL</a>
            <a href="portfolio.html">PORTFOLIO</a>
            <a href="contact.html">CONTACT</a>
        </div>
    </header>

    <div class="container">
        <div class="project-hero">
            <h1 class="project-title">Identité visuelle</h1>
            <h2 class="project-subtitle">Ayamaya</h2>
        </div>

        <img src="aya10.png" alt="Logo Ayamaya" class="hero-image">

        <div class="description-box">
            <div class="description-item">
                <span class="description-label">Date :</span>
                <span class="description-value">2025</span>
            </div>
            <div class="description-item">
                <span class="description-label">Description :</span>
                <span class="description-value">Réalisation d'une identité visuelle pour la maison d'édition Ayamaya</span>
            </div>
        </div>

        <div class="image-grid">
            <div class="grid-item">
                <img src="aya2.jpg" alt="Ayamaya 2">
            </div>
            <div class="grid-item">
                <img src="aya3.jpg" alt="Ayamaya 3">
            </div>
            <div class="grid-item">
                <img src="aya1.jpg" alt="Ayamaya 1">
            </div>
            <div class="grid-item">
                <img src="aya4.jpg" alt="Ayamaya 4">
            </div>
            <div class="grid-item">
                <img src="aya9.jpg" alt="Ayamaya 9">
            </div>
            <div class="grid-item">
                <img src="aya5.jpg" alt="Ayamaya 5">
            </div>
            <div class="grid-item">
                <img src="aya6.jpg" alt="Ayamaya 6">
            </div>
            <div class="grid-item">
                <img src="aya8.jpg" alt="Ayamaya 8">
            </div>
            <div class="grid-item">
                <img src="aya7.jpg" alt="Ayamaya 7">
            </div>
        </div>

        <div class="research-section">
            <div class="research-toggle" onclick="toggleResearch()">
                <span class="research-toggle-text">Recherche</span>
                <span class="research-toggle-arrow" id="arrow">↓</span>
            </div>
            <div class="research-content" id="researchContent">
                <div class="research-inner">
                    <canvas class="pdf-page" id="pdf-canvas-1"></canvas>
                    <canvas class="pdf-page" id="pdf-canvas-2"></canvas>
                    <canvas class="pdf-page" id="pdf-canvas-3"></canvas>
                    <canvas class="pdf-page" id="pdf-canvas-4"></canvas>
                    <canvas class="pdf-page" id="pdf-canvas-5"></canvas>
                    <canvas class="pdf-page" id="pdf-canvas-6"></canvas>
                    <canvas class="pdf-page" id="pdf-canvas-7"></canvas>
                    <canvas class="pdf-page" id="pdf-canvas-8"></canvas>
                    <canvas class="pdf-page" id="pdf-canvas-9"></canvas>
                    <canvas class="pdf-page" id="pdf-canvas-10"></canvas>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> Harsen Schmidt — Designer Graphique</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Curseur personnalisé
        const cursorDot = document.querySelector('.cursor-dot');
        document.addEventListener('mousemove', (e) => {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
        });

        // Toggle recherche
        function toggleResearch() {
            const content = document.getElementById('researchContent');
            const arrow = document.getElementById('arrow');
            content.classList.toggle('open');
            arrow.classList.toggle('open');
            
            // Charger le PDF uniquement lors de la première ouverture
            if (content.classList.contains('open') && !content.dataset.loaded) {
                loadPDF();
                content.dataset.loaded = 'true';
            }
        }

        // Charger et afficher le PDF
        async function loadPDF() {
            const url = 'oral-ayamaya.pdf';
            
            try {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;
                
                // Limiter à 10 pages maximum
                const numPages = Math.min(pdf.numPages, 10);
                
                for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const canvas = document.getElementById(`pdf-canvas-${pageNum}`);
                    
                    if (!canvas) continue;
                    
                    const context = canvas.getContext('2d');
                    const viewport = page.getViewport({ scale: 1.5 });
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    
                    await page.render(renderContext).promise;
                }
            } catch (error) {
                console.error('Erreur lors du chargement du PDF:', error);
            }
        }

        // Animation au scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '0';
                    entry.target.style.transform = 'translateY(30px)';
                    setTimeout(() => {
                        entry.target.style.transition = 'all 0.8s ease';
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }, 100);
                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        });

        document.querySelectorAll('.description-box, .grid-item, .research-section').forEach(item => {
            observer.observe(item);
        });
    </script>
</body>
</html>
