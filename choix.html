<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiches et Éditions - HARSEN Schmidt</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #FF0033;
            --bg-dark: #1a1a1a;
        }

        body {
            font-family: 'Source Code Pro', monospace;
            background: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            z-index: 1000;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        header a:hover {
            color: var(--primary-red);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .portfolio-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .portfolio-header h1 {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 80px;
            font-weight: 400;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }

        .projects-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .project-btn {
            position: relative;
            aspect-ratio: 1;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .project-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-red);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
        }

        .project-btn:hover::before {
            transform: scaleY(1);
        }

        .project-btn:hover {
            border-color: var(--primary-red);
            transform: translateY(-5px);
        }

        .project-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }

        .project-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 32px;
            font-weight: 400;
            letter-spacing: -0.5px;
            line-height: 1.3;
            transition: color 0.3s ease;
        }

        .project-btn:hover .project-title {
            color: #fff;
        }

        .project-arrow {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 24px;
            opacity: 0;
            transform: translate(-10px, 10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-btn:hover .project-arrow {
            opacity: 1;
            transform: translate(0, 0);
        }

        .back-btn {
            position: fixed;
            bottom: 40px;
            left: 40px;
            padding: 12px 24px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-btn:hover {
            border-color: var(--primary-red);
            color: var(--primary-red);
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 80px 20px;
            }

            .portfolio-header h1 {
                font-size: 40px;
            }

            .projects-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .project-title {
                font-size: 24px;
            }

            header {
                padding: 15px 20px;
                gap: 20px;
            }

            header a {
                font-size: 12px;
            }

            .back-btn {
                bottom: 20px;
                left: 20px;
                padding: 10px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html">ACCUEIL</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="contact.html">CONTACT</a>
    </header>

    <div class="container">
        <div class="portfolio-header">
            <h1>AFFICHES ET ÉDITIONS</h1>
        </div>

        <div class="projects-container">
            <a href="affiche.html" class="project-btn">
                <div class="project-content">
                    <h2 class="project-title">Affiches</h2>
                </div>
                <span class="project-arrow">→</span>
            </a>

            <a href="affiche-edition.html" class="project-btn">
                <div class="project-content">
                    <h2 class="project-title">Éditions</h2>
                </div>
                <span class="project-arrow">→</span>
            </a>
        </div>
    </div>

    <a href="portfolio.html" class="back-btn">← AUTRE</a>
</body>
</html>
