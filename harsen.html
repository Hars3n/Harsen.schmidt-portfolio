<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet en cours - HARSEN Schmidt</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #FF0033;
        }

        body {
            font-family: 'Source Code Pro', monospace;
            background: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--primary-red);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            padding: 10px 20px;
            border: 2px solid transparent;
        }

        .back-button:hover {
            color: var(--primary-red);
            border-color: var(--primary-red);
        }

        .back-button::before {
            content: '←';
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .back-button:hover::before {
            transform: translateX(-5px);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-red);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 140px 40px 80px;
            text-align: center;
        }

        .status-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 0, 51, 0.3);
            padding: 80px 60px;
            transition: all 0.3s ease;
        }

        .status-container:hover {
            border-color: var(--primary-red);
            box-shadow: 0 10px 40px rgba(255, 0, 51, 0.2);
        }

        .status-title {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 64px;
            font-weight: 400;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin-bottom: 30px;
            color: var(--primary-red);
        }

        .status-subtitle {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 50px;
            font-weight: 300;
        }

        .return-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            padding: 15px 40px;
            border: 2px solid var(--primary-red);
            background: transparent;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .return-button:hover {
            background: var(--primary-red);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 0, 51, 0.3);
        }

        .secret-section {
            margin-top: 100px;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .secret-section:hover {
            opacity: 1;
        }

        .secret-trigger {
            color: rgba(255, 255, 255, 0.3);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .secret-trigger:hover {
            color: var(--primary-red);
            transform: scale(1.2);
        }

        .secret-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            margin-top: 20px;
        }

        .secret-content.open {
            max-height: 300px;
        }

        .secret-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 0, 51, 0.2);
        }

        .play-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 12px 30px;
            border: 2px solid rgba(255, 0, 51, 0.5);
            background: transparent;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .play-button:hover {
            background: var(--primary-red);
            border-color: var(--primary-red);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 0, 51, 0.3);
        }

        footer {
            padding: 40px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(26, 26, 26, 0.8);
        }

        footer p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            .main-content {
                padding: 100px 20px 60px;
            }

            .status-container {
                padding: 60px 30px;
            }

            .status-title {
                font-size: 40px;
            }

            .status-subtitle {
                font-size: 18px;
            }

            .secret-section {
                margin-top: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="cursor-dot"></div>
    
    <header>
        <a href="identite.html" class="back-button">
            <span>Retour</span>
        </a>
        <div class="nav-links">
            <a href="index.html">ACCUEIL</a>
            <a href="portfolio.html">PORTFOLIO</a>
            <a href="contact.html">CONTACT</a>
        </div>
    </header>

    <div class="main-content">
        <div class="status-container">
            <h1 class="status-title">Projet en cours</h1>
            <p class="status-subtitle">Non disponible pour le moment</p>
            <a href="identite.html" class="return-button">Retour</a>
        </div>

        <div class="secret-section">
            <div class="secret-trigger" onclick="toggleSecret()">+</div>
            <div class="secret-content" id="secretContent">
                <p class="secret-text">
                    J'ai développé un jeu de la vie de John Horton Conway<br>
                    (Le jeu de la vie est un automate cellulaire)
                </p>
                <a href="jeu-de-la-vie.html" class="play-button">Jouer</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> Harsen Schmidt — Designer Graphique</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Curseur personnalisé
        const cursorDot = document.querySelector('.cursor-dot');
        document.addEventListener('mousemove', (e) => {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
        });

        // Toggle secret content
        function toggleSecret() {
            const content = document.getElementById('secretContent');
            const trigger = document.querySelector('.secret-trigger');
            
            content.classList.toggle('open');
            
            if (content.classList.contains('open')) {
                trigger.textContent = '−';
            } else {
                trigger.textContent = '+';
            }
        }
    </script>
</body>
</html>
